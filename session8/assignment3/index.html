
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة تعريف المدرب | coderz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">

        <section class="trainer-card">

            <!-- صورة المدرب -->
            <div class="trainer-image">
                <img src="images/trainer.png" alt="صورة المدرب أحمد خالد">
            </div>

            <!-- معلومات المدرب -->
            <div class="trainer-info">

                <span class="job-title">مدرب تطوير الويب</span>

                <h1>موسى رمزي</h1>

                <p class="description">
                    أساعدك تتعلم بناء صفحات واضحة ومنظمة خطوة بخطوة.
                </p>

                <!-- المهارات -->
                <div class="skills">
                    <span>HTML</span>
                    <span>CSS</span>
                    <span>Git</span>
                </div>

                <!-- الأزرار -->
                <div class="buttons">
                    <a href="#" class="btn primary">
                        شاهد الدورات
                    </a>

                    <a href="#" class="btn secondary">
                        تواصل معي
                    </a>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
