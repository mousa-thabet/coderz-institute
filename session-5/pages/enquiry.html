
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاستفسار عن الكورسات - معهد coderz</title>
</head>
<body>

<header>
    <h1>الاستفسار عن الكورسات</h1>
    <p>أرسل استفسارك وسنساعدك في اختيار الكورس المناسب.</p>
</header>

<nav>
    <a href="../index.html">الرئيسية</a>
    <a href="schedule.html">المواعيد</a>
    <a href="enquiry.html">الاستفسار</a>
</nav>

<main>
    <h2>نموذج الاستفسار</h2>

    <form>
        <label for="name">الاسم:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="email">البريد الإلكتروني:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="course">الكورس المناسب:</label>
        <select id="course" name="course">
            <option value="HTML Content">HTML Content</option>
            <option value="HTML Forms">HTML Forms</option>
        </select>

        <br><br>

        <label for="message">اكتب استفسارك:</label>
        <textarea id="message" name="message"></textarea>

        <br><br>

        <button type="submit">إرسال الاستفسار</button>
    </form>
</main>

<footer>
    <p>جميع الحقوق محفوظة لمعهد coderz</p>
</footer>

</body>
</html>
