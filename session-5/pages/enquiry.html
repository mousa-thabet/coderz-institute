
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>استفسار عن كورس</title>
</head>
<body>

    <h1>استفسار عن كورس</h1>

    <form action="#" method="post">

        <label for="fullname">الاسم الكامل:</label>
        <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="أدخل اسمك الكامل"
            autocomplete="name"
        >
        <br><br>

        <label for="email">البريد الإلكتروني:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            autocomplete="email"
        >
        <br><br>

        <label for="phone">رقم الهاتف:</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="أدخل رقم هاتفك"
            autocomplete="tel"
        >
        <br><br>

        <label for="course">الكورس:</label>
        <select id="course" name="course">
            <option value="">اختر كورسًا</option>
            <option value="content">HTML Content</option>
            <option value="forms">HTML Forms</option>
        </select>
        <br><br>

        <label for="seats">عدد المقاعد:</label>
        <input
            type="number"
            id="seats"
            name="seats"
            value="1"
        >
        <br><br>

        <label for="date">التاريخ المفضل:</label>
        <input
            type="date"
            id="date"
            name="date"
        >
        <br><br>

        <label for="message">نص الاستفسار:</label>
        <br>
        <textarea
            id="message"
            name="message"
            rows="5"
            cols="40"
            placeholder="اكتب استفسارك هنا..."
        ></textarea>
        <br><br>

        <button type="submit">إرسال</button>

    </form>

</body>
</html>
